
[project]
name = "blood-cancer-research"
version = "0.1.0"
description = "CrewAI evidence-based blood cancer research prototype"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.14.0,<2.0.0",
    "requests>=2.32",
    "truststore>=0.10.5"
]

[project.scripts]
blood_cancer = "blood_cancer.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blood_cancer"]

[tool.crewai]
type = "crew"
